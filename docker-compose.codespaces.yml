name: weekly-task-portal

services:
  backend:
    build:
      context: ./backend
    container_name: wtp-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      # Default secret is fine for Codespaces dev; override via .env for production
      JWT_SECRET: ${JWT_SECRET:-codespaces-dev-jwt-secret-replace-in-prod}
      # Wildcard lets the Codespace dynamic URL (*.app.github.dev) through CORS
      CORS_ORIGIN: "*"
    volumes:
      - db_data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: wtp-frontend
    restart: unless-stopped
    # 8080 avoids root-permission issues; Codespaces forwards it automatically
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    name: wtp_cs_db_data
